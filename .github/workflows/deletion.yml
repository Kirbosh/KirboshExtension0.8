name: Remove previews for deleted branches

on:
    delete:

permissions:
    contents: write

jobs:
    delete:
        if: github.event.ref_type == 'branch' && github.event.ref != '0.8-stable' && github.event.ref != 'gh-pages'
        runs-on: ubuntu-latest
        steps:
            - name: Check out Pages output
              uses: actions/checkout@v4
              with:
                  ref: gh-pages
                  path: bundles

            - name: Resolve and remove the deleted branch preview
              shell: bash
              run: |
                  target="$(realpath -m "bundles/${{ github.event.ref }}")"
                  root="$(realpath bundles)"
                  case "$target" in
                    "$root"/*) rm -rf -- "$target" ;;
                    *) echo "Refused unsafe cleanup target: $target" >&2; exit 1 ;;
                  esac

            - name: Deploy cleaned Pages output
              uses: JamesIves/github-pages-deploy-action@v4.7.3
              with:
                  branch: gh-pages
                  folder: bundles
                  clean: false
