name: Validate and publish Paperback 0.8 repository

on:
    pull_request:
        branches:
            - 0.8-stable
    push:
        branches:
            - 0.8-stable
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: paperback-0.8-publish
    cancel-in-progress: false

jobs:
    build:
        name: Build, test, and publish
        runs-on: ubuntu-latest
        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install locked dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Type-check
              run: npm run typecheck

            - name: Run parser tests
              run: npm test

            - name: Check out existing Pages output
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              uses: actions/checkout@v4
              continue-on-error: true
              with:
                  ref: gh-pages
                  path: bundles

            - name: Prepare clean build directory for pull requests
              if: github.event_name == 'pull_request'
              run: mkdir -p bundles

            - name: Generate standard Paperback repository
              run: npm run build

            - name: Verify generated repository
              run: npm run verify:bundle

            - name: Deploy GitHub Pages
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              uses: JamesIves/github-pages-deploy-action@v4.7.3
              with:
                  branch: gh-pages
                  folder: bundles
                  clean: false
